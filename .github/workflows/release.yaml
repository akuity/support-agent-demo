# Builds the harness image when a GitHub release is published:
#   v0.1.0 -> ghcr.io/<owner>/support-agent-demo:0.1.0   (Kargo watches this)
name: release

on:
  release:
    types: [published]

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - id: meta
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$TAG" in
            v[0-9]*) echo "version=${TAG#v}" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Release tag $TAG is not a version (expected vX.Y.Z)"; exit 1 ;;
          esac
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: harness
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/support-agent-demo:${{ steps.meta.outputs.version }}
